[project]
name = "needle-home-assistant"
version = "0.1.0"
description = "Local Needle 3 conversation agent for Home Assistant"
requires-python = ">=3.14.2"
dependencies = ["homeassistant==2026.9.4", "cactus-needle==3.0.1"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.12",
    "gazetteer-matcher==1.1.0",
    "hassil==3.12.1",
    "home-assistant-intents==2026.8.28",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
