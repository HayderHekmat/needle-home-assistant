name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.14
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
  native-musl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check real inference and wrong-library cache recovery on Alpine
        run: |
          docker run --rm -e CI=1 -e HF_HUB_DISABLE_XET=1 \
            -v "$PWD:/work:ro" -w /work python:3.14-alpine \
            sh -ec 'pip install cactus-needle==3.0.6 && python scripts/smoke_model.py --test-libc-recovery'
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
